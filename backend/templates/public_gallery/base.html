<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Cabina 360{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f5f7; color: #171719; }
    main { width: min(100% - 32px, 960px); margin: 0 auto; padding: 40px 0 64px; }
    .card { background: #fff; border: 1px solid #e7e7eb; border-radius: 24px; padding: 28px; box-shadow: 0 12px 40px rgb(0 0 0 / 6%); }
    .eyebrow { color: #65656d; font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1.04; }
    p { color: #65656d; line-height: 1.6; }
    .status { display: inline-flex; margin-top: 20px; padding: 10px 14px; border-radius: 999px; background: #eef2ff; color: #3346a8; font-weight: 650; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
    .video-card { overflow: hidden; color: inherit; text-decoration: none; background: #fff; border: 1px solid #e7e7eb; border-radius: 20px; transition: transform .16s ease, box-shadow .16s ease; }
    .video-card:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgb(0 0 0 / 8%); }
    .video-card img { display: block; width: 100%; aspect-ratio: 9 / 12; object-fit: cover; background: #e9e9ee; }
    .video-card div { padding: 14px 16px 16px; }
    .video-card strong, .video-card span { display: block; }
    .video-card span { margin-top: 4px; color: #65656d; font-size: .9rem; }
    .player { display: block; width: 100%; max-height: 70vh; margin-top: 22px; border-radius: 18px; background: #000; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 20px; border-radius: 14px; background: #171719; color: #fff; font-weight: 700; text-decoration: none; }
    .button.secondary { background: #ededf1; color: #171719; }
    .empty { margin-top: 24px; padding: 28px; border: 1px dashed #d4d4da; border-radius: 20px; text-align: center; }
    @media (prefers-color-scheme: dark) {
      body { background: #101012; color: #f5f5f7; }
      .card { background: #19191c; border-color: #29292e; }
      .video-card { background: #19191c; border-color: #29292e; }
      p, .eyebrow { color: #aaaab2; }
      .video-card span { color: #aaaab2; }
      .status { background: #222a4c; color: #bac5ff; }
      .button { background: #f5f5f7; color: #171719; }
      .button.secondary { background: #29292e; color: #f5f5f7; }
    }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
